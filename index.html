<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orman Gezisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Tam ekran orman tuvali; ahşap düğmeler kenarlarda, kâğıt paneller ortada. Tek görünüm (orman), tema değişmez. */
:root{
  --leaf:#2f6b3a; --leaf2:#4f9a45; --wood:#5b3a22; --wood2:#f3e2bd; --paper:#fffaf0;
  --ink:#23301f; --berry:#c8324a; --water:#3f8fbf; --sun:#f2c230; --mute:#8a8a7a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#2a4a2e;color:var(--ink);font-family:var(--display);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--display);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}

.hud{position:fixed;z-index:5;display:flex;gap:10px}
#hudTL{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px))}
#hudTR{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
#hudBL{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:calc(12px + env(safe-area-inset-left,0px))}
.hb{position:relative;width:66px;height:66px;border-radius:20px;border:3px solid var(--wood);background:linear-gradient(#f9ebcb,#e6cd98);box-shadow:0 4px 0 var(--wood),0 7px 14px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:800;font-size:11px;letter-spacing:.04em;color:#3c2614;padding:0}
.hb svg{width:30px;height:30px}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood)}
.badge{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;border-radius:13px;background:var(--berry);color:#fff;font-size:14px;line-height:26px;border:2px solid #fff;padding:0 4px;box-sizing:border-box}

#toasts{position:fixed;z-index:15;left:50%;top:calc(86px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(92vw,520px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--wood);border-radius:22px;padding:8px 18px;box-shadow:0 5px 0 var(--wood),0 10px 20px rgba(0,0,0,.25);font-weight:800;font-size:22px;line-height:1.1;color:var(--ink);text-align:center;animation:pop .35s ease-out}
.toast small{display:block;font-size:14px;color:var(--leaf);letter-spacing:.08em}
.toast canvas{width:64px;height:48px;flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.veil{position:fixed;inset:0;z-index:20;background:rgba(18,34,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.card{background:var(--paper);border:4px solid var(--wood);border-radius:28px;box-shadow:0 8px 0 var(--wood),0 18px 40px rgba(0,0,0,.35);max-width:560px;width:100%;max-height:100%;overflow:auto;padding:18px 16px 22px;position:relative;text-align:center;box-sizing:border-box}
.card h2{margin:2px 48px 4px;font-size:30px;line-height:1.05;color:var(--leaf);text-wrap:balance}
.card .q{font-size:22px;font-weight:800;color:var(--wood);margin:2px 0 8px}
.x{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;border:3px solid var(--wood);background:var(--wood2);font-weight:800;font-size:24px;line-height:1;color:var(--wood);padding:0}
.speak{position:absolute;top:10px;left:10px;width:48px;height:48px;border-radius:50%;border:3px solid var(--wood);background:var(--wood2);padding:0;display:flex;align-items:center;justify-content:center}
.speak svg{width:26px;height:26px}
#feedAnimal{width:220px;height:150px;display:block;margin:0 auto}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.food{width:112px;border:3px solid var(--wood);border-radius:22px;background:#fff;padding:6px 4px 6px;font-weight:800;font-size:17px;color:var(--ink);box-shadow:0 4px 0 var(--wood)}
.food canvas{width:80px;height:80px;display:block;margin:0 auto}
.food:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood)}
.food.right{background:#d8f1c6}
.food.wrong{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

#pcv{width:100%;max-width:440px;height:auto;aspect-ratio:44/20;display:block;margin:0 auto;touch-action:manipulation}
.eq{font-size:44px;font-weight:800;color:var(--ink);margin:2px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.num{width:88px;height:88px;border-radius:24px;border:3px solid var(--wood);background:#fff;font-weight:800;font-size:44px;color:var(--ink);box-shadow:0 5px 0 var(--wood);padding:0}
.num.right{background:#d8f1c6}.num.wrong{animation:shake .45s;background:#f6e3e3}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0 0}
.dots i{width:16px;height:16px;border-radius:50%;background:#e2d6bb;border:2px solid var(--wood)}
.dots i.on{background:var(--leaf2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:10px}
.al{border:3px solid var(--wood);border-radius:20px;background:#fff;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.al canvas{width:120px;height:84px}
.al b{font-size:16px;line-height:1.05;color:var(--leaf);text-wrap:balance}
.al span{font-size:13px;line-height:1.15;color:var(--ink)}
.al .ok{font-size:13px;color:var(--leaf2)}
.al.lock{background:#efe8d6}.al.lock b{color:var(--mute)}
.go{margin-top:6px;border:3px solid var(--wood);border-radius:16px;background:var(--leaf2);color:#fff;font-weight:800;font-size:15px;padding:6px 12px;box-shadow:0 3px 0 var(--wood)}
.al .sp{border:0;background:none;padding:0}

.set{display:flex;flex-direction:column;gap:14px;text-align:left;margin-top:8px}
.set label{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
.set label span{width:110px;flex:none}
.set input[type=range]{flex:1;min-width:0;height:34px;accent-color:var(--leaf2)}
.tog{border:3px solid var(--wood);border-radius:18px;background:#fff;font-weight:800;font-size:18px;padding:6px 16px;box-shadow:0 3px 0 var(--wood)}
.tog.on{background:#d8f1c6}
.big{border:3px solid var(--wood);border-radius:20px;background:var(--wood2);font-weight:800;font-size:20px;padding:10px 18px;box-shadow:0 4px 0 var(--wood);color:var(--wood)}
.big.red{background:#f4d6d6;color:#8c2230}

#mapScr{position:fixed;inset:0;z-index:30;background:linear-gradient(#bfe3f2,#e9f5df 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));box-sizing:border-box;overflow:auto}
#mapScr h1{margin:0;font-size:clamp(44px,11vw,84px);line-height:.95;color:var(--leaf);letter-spacing:.02em;text-shadow:0 4px 0 #fff, 0 6px 0 rgba(47,107,58,.25);text-align:center}
#mapScr .sub{font-size:20px;font-weight:800;color:var(--wood);margin:0}
#mapBox{position:relative;width:min(100%,900px);aspect-ratio:2/1;border:4px solid var(--wood);border-radius:22px;overflow:hidden;background:#86bcd9;box-shadow:0 6px 0 var(--wood)}
#mapBox svg{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.pin .lab{background:var(--leaf2);color:#fff;border:3px solid #fff;border-radius:16px;padding:4px 12px;font-weight:800;font-size:clamp(14px,3.2vw,20px);white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3);animation:bob 1.6s ease-in-out infinite}
.pin .lab small{display:block;font-size:.7em;letter-spacing:.06em}
.pin .dot{width:18px;height:18px;border-radius:50%;background:var(--berry);border:3px solid #fff;margin-top:4px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.pin.below{transform:translate(-50%,-11px);flex-direction:column-reverse}
.pin.below .dot{margin:0 0 4px}
.pin.soon .lab{background:#9aa3a8;animation:none}
.pin.soon .dot{background:#9aa3a8}
@keyframes bob{50%{transform:translateY(-5px)}}
#fade{position:fixed;inset:0;z-index:40;background:#1d3320;opacity:0;pointer-events:none;transition:opacity .35s}
@media (prefers-reduced-motion:reduce){.pin .lab{animation:none}.toast{animation:none}}
</style>
</head><body>

<canvas id="game" aria-label="Orman"></canvas>

<div class="hud" id="hudTL" hidden>
  <button class="hb" id="bMap" aria-label="Harita"><svg viewBox="0 0 32 32"><path d="M4 7l7-3 10 3 7-3v21l-7 3-10-3-7 3z" fill="#9fd0e6" stroke="#3c2614" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 4v21M21 7v21" stroke="#3c2614" stroke-width="2.4"/><circle cx="16" cy="14" r="3" fill="#c8324a"/></svg>HARİTA</button>
</div>
<div class="hud" id="hudTR" hidden>
  <button class="hb" id="bAlbum" aria-label="Albüm"><svg viewBox="0 0 32 32"><rect x="5" y="4" width="22" height="25" rx="3" fill="#4f9a45" stroke="#3c2614" stroke-width="2.4"/><rect x="9" y="8" width="14" height="10" rx="2" fill="#fff8e6" stroke="#3c2614" stroke-width="2"/><path d="M12 16l3-4 2 2 2-3 3 5z" fill="#2f6b3a"/></svg>ALBÜM<span class="badge" id="albumBadge">0</span></button>
  <button class="hb" id="bSet" aria-label="Ayarlar"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="#e9c46a" stroke="#3c2614" stroke-width="2.4"/><circle cx="16" cy="16" r="3.5" fill="#fff8e6" stroke="#3c2614" stroke-width="2"/><g stroke="#3c2614" stroke-width="3.2" stroke-linecap="round"><path d="M16 2.5v4M16 25.5v4M2.5 16h4M25.5 16h4M6.5 6.5l2.8 2.8M22.7 22.7l2.8 2.8M6.5 25.5l2.8-2.8M22.7 9.3l2.8-2.8"/></g></svg>AYARLAR</button>
</div>
<div class="hud" id="hudBL" hidden>
  <button class="hb" id="bHome" aria-label="Eve dön"><svg viewBox="0 0 32 32"><path d="M4 16L16 5l12 11" fill="none" stroke="#3c2614" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M8 14v13h16V14" fill="#c8324a" stroke="#3c2614" stroke-width="2.4" stroke-linejoin="round"/><rect x="13" y="19" width="6" height="8" fill="#fff8e6" stroke="#3c2614" stroke-width="2"/></svg>EVE DÖN</button>
</div>

<div id="toasts" aria-live="polite"></div>

<div class="veil" id="feedV" hidden>
  <div class="card">
    <button class="speak" id="feedSay" aria-label="Sesli oku"><svg viewBox="0 0 32 32"><path d="M5 12h6l8-6v20l-8-6H5z" fill="#4f9a45" stroke="#3c2614" stroke-width="2.2" stroke-linejoin="round"/><path d="M23 11c2 2.5 2 7.5 0 10M26 8c3.5 4 3.5 12 0 16" fill="none" stroke="#3c2614" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button class="x" data-close="feedV" aria-label="Kapat">✕</button>
    <h2 id="feedName">SİNCAP</h2>
    <canvas id="feedAnimal" width="440" height="300"></canvas>
    <div class="q">NE YER?</div>
    <div class="row" id="feedFoods"></div>
  </div>
</div>

<div class="veil" id="picV" hidden>
  <div class="card">
    <button class="speak" id="picSay" aria-label="Sesli oku"><svg viewBox="0 0 32 32"><path d="M5 12h6l8-6v20l-8-6H5z" fill="#4f9a45" stroke="#3c2614" stroke-width="2.2" stroke-linejoin="round"/><path d="M23 11c2 2.5 2 7.5 0 10M26 8c3.5 4 3.5 12 0 16" fill="none" stroke="#3c2614" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button class="x" data-close="picV" aria-label="Kapat">✕</button>
    <h2>PİKNİK</h2>
    <canvas id="pcv" width="880" height="400"></canvas>
    <div class="q" id="picWord">KAÇ ELMA OLDU?</div>
    <div class="eq" id="picEq">3 + 2 = ?</div>
    <div class="row" id="picNums"></div>
    <div class="dots" id="picDots"></div>
  </div>
</div>

<div class="veil" id="albV" hidden>
  <div class="card">
    <button class="x" data-close="albV" aria-label="Kapat">✕</button>
    <h2>ALBÜM <span id="albCount" style="color:var(--wood)"></span></h2>
    <div class="grid" id="albGrid"></div>
  </div>
</div>

<div class="veil" id="setV" hidden>
  <div class="card">
    <button class="x" data-close="setV" aria-label="Kapat">✕</button>
    <h2>AYARLAR</h2>
    <div class="set">
      <label for="sMusic"><span>MÜZİK</span><input type="range" id="sMusic" min="0" max="100"></label>
      <label for="sFx"><span>EFEKTLER</span><input type="range" id="sFx" min="0" max="100"></label>
      <label><span>SESLİ OKUMA</span><button class="tog" id="sTts">AÇIK</button></label>
      <div class="row" style="margin-top:6px">
        <button class="big" id="sMap">HARİTAYA DÖN</button>
        <button class="big red" id="sReset">BAŞTAN BAŞLA</button>
      </div>
      <div class="row" id="resetAsk" hidden>
        <span style="font-size:20px;font-weight:800;align-self:center">EMİN MİSİN?</span>
        <button class="big red" id="resetYes">EVET</button>
        <button class="big" id="resetNo">HAYIR</button>
      </div>
    </div>
  </div>
</div>

<div id="mapScr">
  <h1>ORMAN GEZİSİ</h1>
  <p class="sub">NEREYE GİDELİM?</p>
  <div id="mapBox"></div>
</div>
<div id="fade"></div>

<script>
(()=>{
'use strict';
/* ================= temel ================= */
const W=2000,H=1500,GS=1.5,SS=2;
let seed=20261110;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const R=(a,b)=>a+rnd()*(b-a);
const MR=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(MR(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);c.fill();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU);c.fill();}
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function catmull(p,steps){const o=[];for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;for(let s=0;s<steps;s++){const t=s/steps,t2=t*t,t3=t2*t;const f=k=>.5*(2*p1[k]+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);o.push([f(0),f(1)]);}}o.push(p[p.length-1]);return o;}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function polyDist(px,py,pl){let m=1e9;for(let i=0;i<pl.length-1;i++){const d=segDist(px,py,pl[i][0],pl[i][1],pl[i+1][0],pl[i+1][1]);if(d<m)m=d;}return m;}
function strokePoly(c,pl,col,w){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(pl[0][0],pl[0][1]);for(let i=1;i<pl.length;i++)c.lineTo(pl[i][0],pl[i][1]);c.stroke();}

/* ================= kayıt ================= */
const KEY='orman_gezisi_v1';
const DEF={px:1000,py:1250,dir:'u',disc:{},fed:{},flowers:[0,0,0,0,0,0],picnics:0,intro:false};
const DSET={music:30,fx:80,tts:true};
let S=JSON.parse(JSON.stringify(DEF)),SET=Object.assign({},DSET);
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){if(d.S)S=Object.assign(S,d.S);if(d.SET)SET=Object.assign(SET,d.SET);}}catch(e){}
function save(){try{S.px=Math.round(P.x);S.py=Math.round(P.y);S.dir=P.dir;localStorage.setItem(KEY,JSON.stringify({S,SET}));}catch(e){}}

/* ================= dünya ================= */
const LAKE={x:1600,y:420,rx:225,ry:145};
const STREAMS=[catmull([[1180,-40],[1120,140],[1240,290],[1395,420]],10),catmull([[1565,555],[1495,690],[1520,850],[1410,990],[1350,1100],[1385,1250],[1310,1540]],10)];
const PATHS=[
 [[1000,1390],[1000,1150],[990,950],[1000,820]],
 [[1000,820],[850,900],[720,1000],[630,1070]],
 [[1000,1250],[1110,1225],[1200,1195]],
 [[1000,820],[860,700],[700,560],[520,460]],
 [[1000,820],[1150,690],[1290,560],[1362,512]],
 [[1290,560],[1420,610],[1600,655],[1770,705]],
 [[1200,1195],[1330,1130],[1460,1050],[1650,960]],
 [[630,1070],[480,1010],[385,975]],
 [[630,1070],[480,1170],[345,1240]],
 [[700,560],[760,450],[795,365]]
].map(p=>catmull(p,10));
const TENT={x:880,y:1300};
const PICNIC={x:620,y:1085};
const BIGTREE={x:800,y:332};
const FLOWERS=[[1135,1160],[1195,1150],[1255,1162],[1150,1215],[1210,1222],[1268,1212]].map((p,i)=>({x:p[0],y:p[1],i,type:['papatya','gelincik','lavanta'][i%3],g:S.flowers[i]?1:0}));
const CLEAR=[[930,1290,170],[1000,820,105],[1100,700,190],[620,1080,120],[1200,1188,115],[470,430,120],[800,332,62],[360,960,92],[320,1250,92],[1690,940,110],[1810,720,105]];

// köprüler
const BRIDGES=[];
for(const pth of PATHS)for(const st of STREAMS){let best=1e9,bi=-1;for(let i=0;i<pth.length;i++){const d=polyDist(pth[i][0],pth[i][1],st);if(d<best){best=d;bi=i;}}if(best<14&&bi>0&&bi<pth.length-1){const a=pth[bi-1],b=pth[bi+1];BRIDGES.push({x:pth[bi][0],y:pth[bi][1],ang:Math.atan2(b[1]-a[1],b[0]-a[0])});}}

function inLake(x,y,pad){const ex=(x-LAKE.x)/(LAKE.rx+pad),ey=(y-LAKE.y)/(LAKE.ry+pad);return ex*ex+ey*ey<1;}
function walkable(x,y){if(x<24||x>W-24||y<50||y>H-14)return false;if(inLake(x,y,-14))return false;if(dist(x,y,TENT.x,TENT.y-18)<38)return false;return true;}
function inStream(x,y){for(const b of BRIDGES)if(dist(x,y,b.x,b.y)<34)return false;for(const s of STREAMS)if(polyDist(x,y,s)<17)return true;return false;}

/* ================= sprite üretimi ================= */
function mk(w,h,draw){const c=document.createElement('canvas');c.width=Math.ceil(w*SS);c.height=Math.ceil(h*SS);const x=c.getContext('2d');x.scale(SS,SS);draw(x);return c;}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=clamp(Math.round(r*k),0,255);g=clamp(Math.round(g*k),0,255);b=clamp(Math.round(b*k),0,255);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

function firSprite(v){const w=96,h=160;return{w,h,ax:48,ay:152,c:mk(w,h,x=>{
  const base=['#1f4b2b','#22502e','#1c4628'][v],lite=shade(base,1.45),mid=shade(base,1.18);
  x.fillStyle='#4a3324';x.fillRect(44,126,8,26);x.fillStyle='#3a271b';x.fillRect(48,126,4,26);
  for(let i=0;i<6;i++){const y0=136-i*21,hw=44-i*6.6+(v===1?2:0),top=y0-36;
    x.fillStyle=base;x.beginPath();x.moveTo(48,top);x.lineTo(48+hw,y0);
    for(let k=1;k<=6;k++){const xx=48+hw-k*(2*hw/6);x.lineTo(xx+hw/6,y0+(k%2?4:0));x.lineTo(xx,y0);}
    x.closePath();x.fill();
    x.fillStyle=mid;x.beginPath();x.moveTo(48,top);x.lineTo(48-hw,y0);x.lineTo(48-hw*.35,y0+3);x.lineTo(48,y0-4);x.closePath();x.fill();
    x.strokeStyle=lite;x.lineWidth=1.3;for(let k=0;k<5;k++){const sx=48-hw*.15-k*hw*.14,sy=y0-6-k*2;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx-6,sy+4);x.stroke();}
  }})};}

  x.fillStyle='#8f8b80';x.beginPath();x.moveTo(58,154);x.quadraticCurveTo(61,120,59,92);x.lineTo(71,92);x.quadraticCurveTo(69,120,73,154);x.closePath();x.fill();
  x.fillStyle='#b1ada0';x.fillRect(60,100,3,40);
  x.strokeStyle='#8f8b80';x.lineWidth=4;line(x,64,104,48,84);line(x,66,100,84,80);

  const blob=(n,rad,cc,ox,oy,rmin,rmax)=>{for(let i=0;i<n;i++){const a=R(0,TAU),d=Math.sqrt(rnd())*rad;x.fillStyle=cc;circ(x,cx+ox+Math.cos(a)*d*1.15,cy+oy+Math.sin(a)*d*.85,R(rmin,rmax));}};
  blob(16,40,cols[0],0,4,16,24);blob(14,34,cols[1],-4,-2,13,20);blob(12,26,cols[2],-9,-9,9,15);blob(10,16,cols[3],-14,-16,5,9);
  x.fillStyle='rgba(255,255,220,.25)';for(let i=0;i<30;i++)circ(x,cx+R(-40,20),cy+R(-45,0),R(1,2));
})};}

const SPR={fir:[0,1,2].map(firSprite),beech:[0,1,2].map(beechSprite),big:bigTreeSprite(),bush:[0,1].map(v=>bushSprite(v,'plain')),hazel:bushSprite(0,'hazel'),berry:bushSprite(0,'berry'),rock:[0,1,2].map(rockSprite),tent:tentSprite()};

/* ================= nesne yerleşimi ================= */
const OBJ=[];const trees=[];
function freeSpot(x,y,pad){
  if(inLake(x,y,46+pad))return false;
  for(const s of STREAMS)if(polyDist(x,y,s)<36+pad)return false;
  for(const p of PATHS)if(polyDist(x,y,p)<32+pad)return false;
  for(const c of CLEAR)if(dist(x,y,c[0],c[1])<c[2]+pad)return false;
  return true;}
for(let i=0;i<3200;i++){
  const x=R(-30,W+30),y=R(20,H+70);const edge=Math.min(x,W-x,y,H-y);
  const p=edge<170?.95:.24;if(rnd()>p)continue;
  if(!freeSpot(x,y,0))continue;
  let ok=true;for(const t of trees)if(Math.abs(t.x-x)<54&&Math.abs(t.y-y)<54&&dist(t.x,t.y,x,y)<54){ok=false;break;}
  if(!ok)continue;
  const fir=(y<720&&rnd()<.72)||rnd()<.3;
  const t={spr:fir?SPR.fir[Math.floor(R(0,3))]:SPR.beech[Math.floor(R(0,3))],x,y,tree:true,fir};trees.push(t);OBJ.push(t);
}
OBJ.push({spr:SPR.big,x:BIGTREE.x,y:BIGTREE.y,tree:true,big:true});
for(let i=0;i<500&&OBJ.length<trees.length+190;i++){const x=R(20,W-20),y=R(40,H);if(!freeSpot(x,y,-10))continue;let ok=true;for(const o of OBJ)if(dist(o.x,o.y,x,y)<34){ok=false;break;}if(ok)OBJ.push({spr:SPR.bush[rnd()<.3?1:0],x,y});}
for(let i=0;i<60;i++){const x=R(20,W-20),y=R(40,H);if(!freeSpot(x,y,-14))continue;OBJ.push({spr:SPR.rock[Math.floor(R(0,3))],x,y});}
for(let i=0;i<14;i++){const x=R(20,400),y=R(60,300);if(!freeSpot(x,y,-20))continue;OBJ.push({spr:SPR.rock[Math.floor(R(0,3))],x,y});}
for(let i=0;i<7;i++){const a=i/7*TAU+.3;OBJ.push({spr:SPR.hazel,x:470+Math.cos(a)*112,y:430+Math.sin(a)*82});}
for(let i=0;i<4;i++){const a=i/4*TAU+.6;OBJ.push({spr:SPR.berry,x:1810+Math.cos(a)*95,y:720+Math.sin(a)*70});}
for(let i=0;i<3;i++){const a=i/3*TAU+1;OBJ.push({spr:SPR.berry,x:320+Math.cos(a)*90,y:1250+Math.sin(a)*66});}
OBJ.push({spr:SPR.tent,x:TENT.x,y:TENT.y});

function buildGround(){
  const g=document.createElement('canvas');g.width=W*GS;g.height=H*GS;const c=g.getContext('2d');c.scale(GS,GS);
  c.fillStyle='#5b943d';c.fillRect(0,0,W,H);
  const greens=['#6aa547','#538a37','#78b151','#4c7f33','#86bb5c','#5f9a3c','#6f9a3a'];
  for(let i=0;i<560;i++){const x=R(0,W),y=R(0,H),r=R(30,150);const gr=c.createRadialGradient(x,y,0,x,y,r);const col=greens[i%greens.length];gr.addColorStop(0,col+'99');gr.addColorStop(1,col+'00');c.fillStyle=gr;c.fillRect(x-r,y-r,r*2,r*2);}
  // orman tabanı: kenarlarda daha koyu, yaprak döküntüsü
  const eg=c.createLinearGradient(0,0,0,H);eg.addColorStop(0,'rgba(40,60,25,.35)');eg.addColorStop(.18,'rgba(40,60,25,0)');eg.addColorStop(.88,'rgba(40,60,25,0)');eg.addColorStop(1,'rgba(40,60,25,.3)');c.fillStyle=eg;c.fillRect(0,0,W,H);
  // yamaç (sol üst)
  for(let k=0;k<8;k++){c.beginPath();c.ellipse(80,30,470-k*56,340-k*42,0,0,TAU);c.fillStyle=k%2?'rgba(35,70,25,.12)':'rgba(140,175,90,.12)';c.fill();c.strokeStyle='rgba(45,85,32,.4)';c.lineWidth=2.5;c.stroke();}
  for(let i=0;i<40;i++){c.fillStyle='rgba(120,110,95,.5)';ell(c,R(10,360),R(10,250),R(3,8),R(2,4));}
  // çayır
  let gr=c.createRadialGradient(1100,700,10,1100,700,240);gr.addColorStop(0,'#9cca66cc');gr.addColorStop(1,'#9cca6600');c.fillStyle=gr;c.fillRect(840,440,520,520);
  gr=c.createRadialGradient(620,1080,10,620,1080,150);gr.addColorStop(0,'#a7cf72bb');gr.addColorStop(1,'#a7cf7200');c.fillStyle=gr;c.fillRect(460,920,320,320);
  // ağaç gölgeleri ve döküntü
  for(const o of OBJ){if(!o.tree)continue;c.fillStyle='rgba(20,45,15,.30)';ell(c,o.x+8,o.y+2,o.big?62:o.fir?30:36,o.big?18:10);
    if(!o.fir){for(let k=0;k<6;k++){c.fillStyle=['#b98a3e','#9b6b33','#c9a24f'][k%3];ell(c,o.x+R(-34,34),o.y+R(-6,14),2.2,1.3,R(0,3));}}}
  // patikalar
  for(const p of PATHS)strokePoly(c,p,'#86714a',52);
  for(const p of PATHS)strokePoly(c,p,'#b9a072',42);
  for(const p of PATHS)strokePoly(c,p,'#c9b388',28);
  for(const p of PATHS)for(let i=0;i<p.length;i++){for(let k=0;k<3;k++){c.fillStyle=['#a08a62','#d8c7a2','#8f7b56'][k];ell(c,p[i][0]+R(-17,17),p[i][1]+R(-17,17),R(1.2,2.8),R(1,2));}}
  // dere
  for(const s of STREAMS)strokePoly(c,s,'#41622f',66);
  for(const s of STREAMS)strokePoly(c,s,'#8c8a73',50);
  for(const s of STREAMS)strokePoly(c,s,'#2c6a8e',38);
  for(const s of STREAMS)strokePoly(c,s,'#3f8fbf',28);
  for(const s of STREAMS)for(let i=0;i<s.length;i+=2){c.fillStyle='#8d8f86';ell(c,s[i][0]+R(-24,24),s[i][1]+R(-24,24),R(2,5),R(1.5,3.5));}
  // göl
  c.fillStyle='#41622f';ell(c,LAKE.x,LAKE.y,LAKE.rx+30,LAKE.ry+26);
  c.fillStyle='#cbb98a';ell(c,LAKE.x,LAKE.y,LAKE.rx+16,LAKE.ry+14);
  gr=c.createRadialGradient(LAKE.x-40,LAKE.y-30,10,LAKE.x,LAKE.y,LAKE.rx);gr.addColorStop(0,'#2a6b97');gr.addColorStop(.7,'#3a87b8');gr.addColorStop(1,'#5aa7cf');c.fillStyle=gr;ell(c,LAKE.x,LAKE.y,LAKE.rx,LAKE.ry);
  for(let i=0;i<9;i++){const a=R(0,TAU),d=R(.55,.85);const x=LAKE.x+Math.cos(a)*LAKE.rx*d,y=LAKE.y+Math.sin(a)*LAKE.ry*d;c.fillStyle='#3f8a3a';c.beginPath();c.arc(x,y,9,.3,TAU-.2);c.lineTo(x,y);c.fill();if(i%3===0){c.fillStyle='#fff';circ(c,x+2,y-2,3.5);c.fillStyle='#f2d24a';circ(c,x+2,y-2,1.3);}}
  for(let i=0;i<120;i++){const a=R(0,TAU);const x=LAKE.x+Math.cos(a)*(LAKE.rx+R(-6,12)),y=LAKE.y+Math.sin(a)*(LAKE.ry+R(-6,10));if(Math.sin(a)<-.2&&rnd()<.6)continue;c.strokeStyle=rnd()<.5?'#5d7d2b':'#7b9a3a';c.lineWidth=1.6;line(c,x,y,x+R(-3,3),y-R(10,20));if(rnd()<.15){c.fillStyle='#6b4428';ell(c,x,y-18,1.8,4);}}
  // köprüler
  for(const b of BRIDGES){c.save();c.translate(b.x,b.y);c.rotate(b.ang);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(-36,-20,74,42);
    for(let k=-34;k<34;k+=8){c.fillStyle=(k/8)%2?'#9a6a3e':'#8a5c33';c.fillRect(k,-19,7,38);}
    c.fillStyle='#5f3d22';c.fillRect(-36,-22,72,5);c.fillRect(-36,17,72,5);c.restore();}
  // çimen
  for(let i=0;i<15000;i++){const x=R(0,W),y=R(0,H);if(inLake(x,y,20))continue;if(i%3===0){let bad=false;for(const s of STREAMS)if(polyDist(x,y,s)<30){bad=true;break;}if(bad)continue;}
    c.strokeStyle=['#3f7a2c','#7dbb52','#4f8f36','#93c768','#356b25'][i%5];c.lineWidth=1.1;line(c,x,y,x+R(-2.5,2.5),y-R(4,9));}
  // çayırda uzun ot
  for(let i=0;i<260;i++){const a=R(0,TAU),d=Math.sqrt(rnd())*200;const x=1100+Math.cos(a)*d,y=700+Math.sin(a)*d*.8;c.strokeStyle=['#6fa743','#8fc25a','#5c9437'][i%3];c.lineWidth=1.4;for(let k=0;k<4;k++)line(c,x+k*2,y,x+k*2+R(-4,4),y-R(10,16));}
  // kır çiçekleri
  for(let i=0;i<800;i++){const x=R(0,W),y=R(0,H);if(inLake(x,y,24))continue;const col=['#ffffff','#f3e15a','#c9a3e6','#f29fb5','#ffffff'][i%5];c.fillStyle=col;circ(c,x,y,1.7);if(col==='#ffffff'){c.fillStyle='#f2d24a';circ(c,x,y,.7);}}
  // piknik örtüsü
  c.save();c.translate(PICNIC.x,PICNIC.y);c.rotate(-.08);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(-60,-34,124,74);
  for(let i=0;i<8;i++)for(let j=0;j<5;j++){c.fillStyle=(i+j)%2?'#f6f1e6':'#cf3a4a';c.fillRect(-62+i*15,-38+j*14.8,15,14.8);}
  c.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<8;i++)c.fillRect(-62+i*15,-38,7,74);c.restore();
  // bahçe toprağı
  gr=c.createRadialGradient(1200,1188,10,1200,1188,110);gr.addColorStop(0,'#8a6a45aa');gr.addColorStop(1,'#8a6a4500');c.fillStyle=gr;c.fillRect(1080,1070,240,240);
  // çit
  c.strokeStyle='#7a5230';c.lineWidth=3;for(const yy of [1118,1258]){line(c,1100,yy,1300,yy);for(let xx=1100;xx<=1300;xx+=20){c.fillStyle='#8a5c33';c.fillRect(xx-2,yy-12,5,14);}}
  return g;}

/* ================= çizimler: kız ================= */
const SK='#f3c9a6',HAIR='#4b2a17',DRESS='#d8467a',DRESS2='#b3325d',LEG='#2f4277',BOOT='#6a3b20',PACK='#3f8f4f';
function drawGirl(c,x,y,dir,ph,moving,act,t){
  c.save();c.translate(x,y);
  c.fillStyle='rgba(0,0,0,.22)';ell(c,0,0,13,5);
  const bob=moving?-Math.abs(Math.sin(ph))*2:0;c.translate(0,bob);
  const sw=moving?Math.sin(ph):0;
  const side=dir==='l'||dir==='r';if(dir==='l')c.scale(-1,1);
  c.lineCap='round';c.lineJoin='round';
  if(side){
    c.strokeStyle=shade(LEG,.8);c.lineWidth=5;line(c,-1,-16,-1-sw*5,-3);c.fillStyle=shade(BOOT,.85);ell(c,-sw*5+1,-2,4.2,2.6);
    c.fillStyle=PACK;rrect(c,-13,-36,7,16,3);c.fill();
    c.fillStyle=DRESS;c.beginPath();c.moveTo(-6,-37);c.lineTo(5,-37);c.lineTo(10,-14);c.quadraticCurveTo(0,-11,-10,-14);c.closePath();c.fill();
    c.fillStyle=DRESS2;c.beginPath();c.moveTo(-6,-37);c.lineTo(-2,-37);c.lineTo(-4,-12.5);c.quadraticCurveTo(-7,-13,-10,-14);c.closePath();c.fill();
    c.strokeStyle=LEG;c.lineWidth=5;line(c,1,-16,1+sw*5,-3);c.fillStyle=BOOT;ell(c,sw*5+3,-2,4.2,2.6);
    c.strokeStyle='#2d6b3a';c.lineWidth=2.2;line(c,-4,-36,-6,-24);
    if(act==='water'){c.strokeStyle=DRESS;c.lineWidth=4.6;line(c,0,-33,8,-27);c.fillStyle=SK;circ(c,10,-26,2.6);drawCan(c,13,-25,true);}
    else{c.strokeStyle=DRESS;c.lineWidth=4.6;line(c,0,-33,-sw*6,-24);c.fillStyle=SK;circ(c,-sw*7,-21,2.6);}
    c.fillStyle=SK;circ(c,1,-48,12);
    c.fillStyle=HAIR;c.beginPath();c.arc(1,-49,12.8,Math.PI*.62,Math.PI*1.9);c.quadraticCurveTo(10,-55,8,-50);c.quadraticCurveTo(2,-54,-2,-47);c.lineTo(-5,-40);c.closePath();c.fill();
    ell(c,-12,-43,4.5,7.5,-.3);c.fillStyle=SET_RIB;ell(c,-10,-50,3,2,.5);ell(c,-13,-51,3,2,-.5);
    c.fillStyle='#2a1a12';ell(c,7,-46,1.7,2.3);c.fillStyle='#fff';circ(c,7.5,-46.8,.7);
    c.fillStyle='rgba(240,120,130,.45)';circ(c,7,-41.5,2.3);
    c.fillStyle=SK;ell(c,12.8,-44,1.8,1.5);
    c.strokeStyle='#8a3a2a';c.lineWidth=1.2;c.beginPath();c.arc(9,-40.5,1.8,.2,1.6);c.stroke();
  }else{

  // baloncuklar
  for(const a of AN){const ay=a.fixed?a.y-36:a.y-a.d.h*(a.d.sc||1)-22;if(dist(P.x,P.y,a.x,a.fixed?BIGTREE.y:a.y)<280&&!(S.fed[a.id])&&a.eatT<=0)drawBubble(ctx,a.x,ay,'heart',t+a.x);}
  for(const f of FLOWERS){if(f.g<1&&dist(P.x,P.y,f.x,f.y)<260&&P.act!=='water')drawBubble(ctx,f.x,f.y-34,'drop',t+f.i);}
  if(dist(P.x,P.y,PICNIC.x,PICNIC.y)<300)drawBubble(ctx,PICNIC.x,PICNIC.y-58,'apple',t);
  // parçacıklar
  for(const p of PARTS){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));
    if(p.kind==='heart'){ctx.fillStyle='#e0457a';heart(ctx,p.x,p.y,5+(1-p.life)*3);}
    else if(p.kind==='drop'){ctx.fillStyle='#5aaad6';ell(ctx,p.x,p.y,1.6,2.6);}
    else if(p.kind==='ring'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(p.x,p.y,4+(1-p.life)*12,2+(1-p.life)*5,0,0,TAU);ctx.stroke();}
    else if(p.kind==='spark'){ctx.fillStyle='#f6e27a';circ(ctx,p.x,p.y,2.2*p.life+.5);}
    else if(p.kind==='zz'){ctx.fillStyle='#fff';ctx.font='800 12px "Baloo 2",sans-serif';ctx.fillText('Z',p.x,p.y);}
  }
  ctx.globalAlpha=1;
  // ekran katmanı: yaprak ve kenar gölgesi
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const l of LEAVES){ctx.save();ctx.translate(l.x*VW,l.y*VH);ctx.rotate(l.r);ctx.fillStyle=l.c;ell(ctx,0,0,5,2.6);ctx.restore();}
  ctx.fillStyle=vign;ctx.fillRect(0,0,VW,VH);
}

/* ================= güncelleme ================= */
let ptr=null,discT=0,saveT=0,knockT=0;
function goalPos(g){if(g.kind==='animal'){const a=g.ref;if(a.fixed)return{x:BIGTREE.x+34,y:BIGTREE.y+14,r:16};return{x:a.x,y:a.y,r:46+a.d.hit*.6};}
  if(g.kind==='flower')return{x:g.ref.x,y:g.ref.y+20,r:12};if(g.kind==='picnic')return{x:PICNIC.x+10,y:PICNIC.y+48,r:16};return{x:g.x,y:g.y,r:6};}
function arrive(g){if(g.kind==='animal'){const a=g.ref;P.dir=a.x<P.x?'l':'r';if(a.fixed)P.dir='u';openFeed(a);}
  else if(g.kind==='flower'){P.dir='u';water(g.ref);}else if(g.kind==='picnic'){P.dir='u';openPicnic();}}
function update(dt,t){
  if(uiOpen()){P.moving=false;}else{
  let tx=null,ty=null,want=false;
  if(ptr){const w=toWorld(ptr.x,ptr.y);if(dist(w.x,w.y,P.x,P.y-24)>10){tx=w.x;ty=w.y+10;want=true;}}
  else if(P.goal){const gp=goalPos(P.goal);if(dist(gp.x,gp.y,P.x,P.y)<=gp.r){const g=P.goal;P.goal=null;arrive(g);}else{tx=gp.x;ty=gp.y;want=true;}}
  P.moving=false;
  if(want&&P.act!=='water'){const dx=tx-P.x,dy=ty-P.y,d=Math.hypot(dx,dy);const wet=inStream(P.x,P.y);const sp=(wet?95:160)*dt;const st=Math.min(sp,d);const nx=P.x+dx/d*st,ny=P.y+dy/d*st;
    let moved=true;if(walkable(nx,ny)){P.x=nx;P.y=ny;}else if(walkable(nx,P.y)&&Math.abs(dx)>1){P.x=nx;}else if(walkable(P.x,ny)&&Math.abs(dy)>1){P.y=ny;}else moved=false;
    if(moved){P.moving=true;P.stuck=0;P.ph+=dt*12;P.dir=Math.abs(dx)>Math.abs(dy)*1.1?(dx<0?'l':'r'):(dy<0?'u':'d');if(wet&&Math.random()<dt*8){part(P.x+MR(-6,6),P.y,'ring',{life:1,dec:1.2});if(Math.random()<.3)sfx('splash');}}
    else{P.stuck+=dt;if(P.stuck>.5&&P.goal){const g=P.goal;P.goal=null;const gp=goalPos(g);if(dist(gp.x,gp.y,P.x,P.y)<gp.r*3)arrive(g);}}
  }}
  if(P.act==='water'){P.actT-=dt;const f=P.actF;if(Math.random()<dt*30){const hx=P.x+(P.dir==='l'?-24:P.dir==='r'?24:18),hy=P.y-24;part(hx+MR(-3,3),hy,'drop',{vy:MR(40,80),vx:MR(-15,15),dec:1.8});}
    if(f&&P.actT<.8){f.wet=4;if(f.g<1)f.g=Math.min(1,f.g+dt*1.3);}
    if(P.actT<=0){P.act=null;if(f&&!S.flowers[f.i]){f.g=1;S.flowers[f.i]=1;sfx('grow');for(let i=0;i<10;i++)part(f.x+MR(-18,18),f.y-MR(5,30),'spark',{vy:-20,dec:1});spawnInsects();save();
      const n=S.flowers.filter(Boolean).length;if(n===1)toast('KELEBEKLER GELİYOR!',{ms:2200});if(n===6)toast('BAHÇE ÇİÇEK AÇTI!',{ms:2400});}}}
  for(const f of FLOWERS)if(f.wet>0)f.wet-=dt;
  // hayvanlar
  for(const a of AN){a.t+=dt;if(a.eatT>0){a.eatT-=dt;a.moving=false;if(Math.random()<dt*3)part(a.x+MR(-8,8),a.y-(a.fixed?40:a.d.h*1.2),'heart',{vy:-30,dec:.7});continue;}
    if(a.fullT>0)a.fullT-=dt;
    if(a.fixed||a.frozen){a.moving=false;continue;}
    const near=dist(P.x,P.y,a.x,a.y)<70;
    if(near){a.moving=false;a.face=P.x<a.x?-1:1;continue;}
    a.timer-=dt;
    if(a.timer<=0){if(a.moving){a.moving=false;a.timer=MR(1.5,4.5);}else{for(let k=0;k<8;k++){const ang=MR(0,TAU),rr=MR(0,a.d.r);const x=a.d.home[0]+Math.cos(ang)*rr,y=a.d.home[1]+Math.sin(ang)*rr*.75;if(walkable(x,y)&&!inLake(x,y,30)){a.tx=x;a.ty=y;a.moving=true;a.timer=8;break;}}}}
    if(a.moving){const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d<3){a.moving=false;a.timer=MR(1.5,4.5);}else{const st=Math.min(d,a.d.spd*dt);a.x+=dx/d*st;a.y+=dy/d*st;if(Math.abs(dx)>2)a.face=dx<0?-1:1;}}
  }
  // ağaçkakan davulu
  knockT-=dt;const wp=AN.find(a=>a.id==='agackakan');if(knockT<=0){knockT=MR(4,8);if(dist(P.x,P.y,wp.x,wp.y)<330&&!uiOpen())sfx('knock');}
  // böcekler
  for(const b of INS){const tt=t*b.sp+b.ph;if(b.kind==='kelebek'){b.x=b.hx+Math.sin(tt*.9)*55+Math.sin(tt*2.3)*12;b.y=b.hy-26+Math.cos(tt*1.1)*24+Math.sin(tt*3.1)*5;}else{b.x=b.hx+Math.sin(tt*1.7)*30+Math.sin(tt*5)*6;b.y=b.hy-14+Math.cos(tt*2.1)*14;}}
  // parçacıklar
  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.life-=dt*(p.dec||1);p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.kind==='drop')p.vy+=200*dt;if(p.life<=0)PARTS.splice(i,1);}
  for(const l of LEAVES){l.y+=dt*.03*l.s;l.x+=Math.sin(t*.8+l.r)*dt*.01;l.r+=dt*.8*l.s;if(l.y>1.05){l.y=-.05;l.x=MR(0,1);}}
  // keşif
  discT-=dt;if(discT<=0){discT=.3;for(const a of AN){if(!S.disc[a.id]&&dist(P.x,P.y,a.x,a.fixed?BIGTREE.y:a.y)<190)discover(a.id);}
    for(const b of INS){if(!S.disc[b.kind]&&dist(P.x,P.y,b.x,b.y)<170)discover(b.kind);}}
  saveT-=dt;if(saveT<=0){saveT=3;save();}
  musicTick(dt);
}

function hitTest(x,y){
  for(const a of AN){const sc=a.d.sc||1;const cx=a.x,cy=a.fixed?a.y-12*sc:a.y-a.d.h*sc*.5;if(dist(x,y,cx,cy)<a.d.hit*sc+8)return{kind:'animal',ref:a};}
  for(const f of FLOWERS)if(dist(x,y,f.x,f.y-8)<28)return{kind:'flower',ref:f};
  if(Math.abs(x-PICNIC.x)<72&&Math.abs(y-PICNIC.y)<52)return{kind:'picnic'};
  return null;}
cv.addEventListener('pointerdown',e=>{if(uiOpen()||mapOpen)return;audioInit();const w=toWorld(e.clientX,e.clientY);const h=hitTest(w.x,w.y);
  if(h){P.goal=h;ptr=null;sfx('tap');return;}
  ptr={id:e.pointerId,t0:performance.now(),x:e.clientX,y:e.clientY};P.goal=null;try{cv.setPointerCapture(e.pointerId);}catch(_){} });
cv.addEventListener('pointermove',e=>{if(ptr&&e.pointerId===ptr.id){ptr.x=e.clientX;ptr.y=e.clientY;}});
function endPtr(e){if(!ptr||e.pointerId!==ptr.id)return;if(performance.now()-ptr.t0<220){const w=toWorld(ptr.x,ptr.y);P.goal={kind:'pt',x:w.x,y:w.y+10};}ptr=null;}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptr=null;});

let PQ=[],pi=0,pcount={},pBusy=false;
const FR=['elma','cilek','armut'];
function makeQ(i){const f=FR[RI(0,2)];if(i%2===0){const a=RI(1,6),b=RI(1,4);return{f,a,b,op:'+',ans:a+b};}const a=RI(3,9),b=RI(1,a-1);return{f,a,b,op:'-',ans:a-b};}
function openPicnic(){PQ=[0,1,2,3].map(makeQ);pi=0;show('picV');showQ();}
function qSentence(q){const n=FOOD[q.f].toLocaleLowerCase('tr-TR');return q.op==='+'?`Sepette ${q.a} ${n} var. ${q.b} ${n} daha koyduk. Kaç ${n} oldu?`:`${q.a} ${n} vardı. ${q.b} tanesini yedik. Kaç ${n} kaldı?`;}
function showQ(){const q=PQ[pi];pcount={};pBusy=false;
  $('picWord').textContent=q.op==='+'?`KAÇ ${FOOD[q.f]} OLDU?`:`KAÇ ${FOOD[q.f]} KALDI?`;
  $('picEq').textContent=`${q.a} ${q.op==='+'?'+':'−'} ${q.b} = ?`;
  const ans=new Set([q.ans]);while(ans.size<4){const v=q.ans+RI(-3,3);if(v>=0&&v<=20)ans.add(v);}
  const nb=$('picNums');nb.innerHTML='';[...ans].sort((a,b)=>a-b).forEach(v=>{const b=document.createElement('button');b.className='num';b.textContent=v;b.addEventListener('click',()=>pickNum(v,b));nb.appendChild(b);});
  $('picDots').innerHTML=PQ.map((_,i)=>`<i class="${i<pi?'on':''}"></i>`).join('');
  drawPic();say(qSentence(q));}
$('picSay').addEventListener('click',()=>say(qSentence(PQ[pi])));
function fruitPos(q){const pts=[];const Wc=880,Hc=400;
  if(q.op==='+'){const lay=(n,x0,x1,row)=>{const cols=Math.min(n,3);for(let i=0;i<n;i++){const r=Math.floor(i/3),c=i%3;const cw=(x1-x0)/3;pts.push({x:x0+cw*(c+.5)+(cols<3?(3-cols)*cw/2:0),y:row+r*120,g:x0<400?0:1});}};
    lay(q.a,40,400,Hc/2-(q.a>3?60:0));lay(q.b,480,840,Hc/2-(q.b>3?60:0));}
  else{const per=q.a>5?5:q.a;for(let i=0;i<q.a;i++){const r=Math.floor(i/per),c=i%per;const rowN=Math.min(per,q.a-r*per);pts.push({x:Wc/2+(c-(rowN-1)/2)*150,y:(q.a>5?Hc/2-65:Hc/2)+r*130,eaten:i>=q.a-q.b});}}
  return pts;}
function drawPic(){const c=$('pcv').getContext('2d');const q=PQ[pi];c.clearRect(0,0,880,400);
  c.fillStyle='#f7efe0';rrect(c,6,6,868,388,30);c.fill();c.save();c.globalAlpha=.25;for(let i=0;i<15;i++)for(let j=0;j<7;j++){if((i+j)%2){c.fillStyle='#cf3a4a';c.fillRect(6+i*58,6+j*56,58,56);}}c.restore();

}

const WATER=[[[28,41],[28,44],[32,46],[37,45],[41,42],[36,41],[31,41]],[[47,45],[53,47],[54,41],[51,37],[49,38],[47,42]]];
function buildMap(){const P2=p=>`${(p[0]+180).toFixed(1)},${(90-p[1]).toFixed(1)}`;
  let s=`<svg viewBox="0 0 360 180" preserveAspectRatio="none" role="img" aria-label="Dünya haritası"><rect width="360" height="180" fill="#86bcd9"/>`;
  for(let k=1;k<6;k++)s+=`<path d="M0 ${k*30}H360" stroke="#9cc9e2" stroke-width=".4"/>`;
  for(const pl of LAND)s+=`<polygon points="${pl.map(P2).join(' ')}" fill="${pl[0][1]<-60?'#f4f8fb':'#d9e6b4'}" stroke="#8aa36a" stroke-width=".6" stroke-linejoin="round"/>`;
  for(const pl of WATER)s+=`<polygon points="${pl.map(P2).join(' ')}" fill="#86bcd9" stroke="#8aa36a" stroke-width=".5"/>`;
  s+=`<ellipse cx="${31.6+180}" cy="${90-40.7}" rx="3.2" ry="1.8" fill="#2f6b3a"/>`;
  s+='</svg>';
  s+=`<button class="pin below" id="pinBolu" style="left:${(31.6+180)/3.6}%;top:${(90-40.7)/1.8}%"><span class="lab">BOLU ORMANI</span><span class="dot"></span></button>`;
  s+=`<button class="pin soon" id="pinAnt" style="left:${(20+180)/3.6}%;top:${(90+72)/1.8}%"><span class="lab">ANTARKTİKA<small>YAKINDA</small></span><span class="dot"></span></button>`;
  $('mapBox').innerHTML=s;
  $('pinBolu').addEventListener('click',()=>{audioInit();sfx('ok');enterForest();});
  $('pinAnt').addEventListener('click',()=>{audioInit();sfx('soft');say('Antarktika yakında. Orada penguenler var.');});}
buildMap();
let mapOpen=true;
function openMap(){mapOpen=true;$('mapScr').hidden=false;['hudTL','hudTR','hudBL'].forEach(i=>$(i).hidden=true);save();say('Nereye gidelim?');}
function enterForest(){mapOpen=false;$('mapScr').hidden=true;['hudTL','hudTR','hudBL'].forEach(i=>$(i).hidden=false);
  if(!S.intro){S.intro=true;save();
    toast('ORMAN GEZİSİNE HOŞ GELDİN!',{ms:2600});
    toast('BURASI HAYVAN BAKIM ALANI.',{ms:2600});
    toast('GERÇEK ORMANDA HAYVAN BESLENMEZ.',{ms:3000});
    toast('PARMAĞINLA YÜRÜ, HAYVANA DOKUN.',{ms:3000});}
  else say('Bolu ormanı');}

/* ================= döngü ================= */
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(!mapOpen)update(dt,T);
  render(T);
  if(feedA&&!$('feedV').hidden){const c=$('feedAnimal').getContext('2d');c.clearRect(0,0,440,300);c.fillStyle='#e9f3d9';rrect(c,10,10,420,280,30);c.fill();c.fillStyle='#cfe3b0';ell(c,220,250,150,26);
    const d=feedA.d,sc=(d.sc||1)*(feedA.id==='ayi'?2.4:feedA.id==='karaca'?2.8:feedA.id==='agackakan'?3.6:3.6);
    if(feedA.id==='agackakan'){c.fillStyle='#8f8b80';c.fillRect(140,10,60,280);c.fillStyle='#a8a396';c.fillRect(156,10,10,280);}
    c.save();c.translate(feedA.id==='agackakan'?214:220-(feedA.id==='ayi'?40:feedA.id==='karaca'?30:0),feedA.id==='agackakan'?220:250);c.scale(sc,sc);DRAW[feedA.id](c,T,{moving:false,still:true});c.restore();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
